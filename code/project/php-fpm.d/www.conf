; PHP-FPM 池配置。上游默认 pm.max_children = 5 且不回收 worker，对生产偏小。
; 数值按「单机同时跑本项目与 realchip」保守取值，可按服务器内存上调：
; 每个 worker 常驻约 40-60MB，此处最坏约 10 × 60MB = 600MB。
[www]
; 上游 www.conf 里的这两行必须保留：本文件整体替换上游文件，缺了 user 时 FPM 会
; 直接以「ALERT: [pool www] user has not been defined / FPM initialization failed」拒绝启动。
user = www-data
group = www-data
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; 回收：限制单个 worker 处理多少请求后退出，界定 opcache / 内存漂移
pm.max_requests = 500

; 必须大于 php.ini 的 max_execution_time(120)，否则 FPM 先杀 worker，
; 用户拿到的是 502 而不是 PHP 的致命错误
request_terminate_timeout = 130s
